services:
  db:
    image: postgres:16-alpine
    container_name: mvp_es_db
    environment:
      POSTGRES_USER: mvp
      POSTGRES_PASSWORD: mvp
      POSTGRES_DB: mvp
      TZ: America/Sao_Paulo
    ports:
      # 5435 no host para não conflitar com instalações locais do Postgres (5432/5433)
      - "${DB_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp -d mvp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
